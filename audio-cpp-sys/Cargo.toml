[package]
name = "audio-cpp-sys"
description = "Raw FFI bindings to the audio.cpp C ABI (audiocpp.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "audiocpp"
build = "build.rs"
categories = ["external-ffi-bindings", "multimedia::audio"]

[build-dependencies]
cmake = "0.1"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["openmp"]
# Build host code with OpenMP (ENGINE_ENABLE_OPENMP).
openmp = []
# Source builds only: compile ggml CPU kernels for the host ISA
# (ENGINE_ENABLE_NATIVE_CPU). Faster, but the library only runs on CPUs like
# the build machine's.
native = []
cuda = []
hip = []
vulkan = []
metal = []
